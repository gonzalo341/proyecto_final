<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Ciudadano - Ingreso y Registro de Sesión</title>
    <link rel="stylesheet" href="/assets/css/login.css">
</head>

<body>

    <div id="shared-header"></div>

    <main>
        <section>
            <div class="tab-container">
                <!-- Pestañas Superiores -->
                <ul class="tab-list">
                    <li class="tab-item option-active login-tab" id="login-option">Iniciar Sesión</li>
                    <li class="tab-item" id="register-option">Registrarse</li>
                </ul>

                <div class="content-container">

                    <!-- 1. PESTAÑA / CONTENIDO DE INICIO DE SESIÓN -->
                    <div class="content content-active" id="login-content">
                        <h2>Bienvenido al Sistema</h2>
                        <p>Por favor, ingresa tus credenciales para acceder a tu cuenta.</p>

                        <form id="loginForm">
                            <div class="form-group">
                                <label for="login-email">Correo electrónico:</label>
                                <input class="form-input" type="email" id="login-email" name="email"
                                    placeholder="Ingresa tu correo electrónico" required>
                            </div>

                            <div class="form-group">
                                <label for="login-password">Contraseña:</label>
                                <input class="form-input" type="password" id="login-password" name="password"
                                    placeholder="Ingresa tu contraseña" minlength="8" maxlength="20" required>
                            </div>

                            <div class="form-group-checkbox">
                                <input class="form-checkbox" type="checkbox" id="remember-me" name="remember-me">
                                <label for="remember-me">Recordar mi sesión en este dispositivo</label>
                            </div>

                            <!-- Mensaje de Feedback de Login -->
                            <div id="login-message" class="login-mensaje" role="alert" aria-live="polite" hidden></div>

                            <button class="btn-submit" type="submit">Ingresar</button>
                        </form>

                        <p>¿No tienes una cuenta? <a href="#" id="link-to-register">Regístrate aquí</a></p>
                    </div>

                    <!-- 2. PESTAÑA / CONTENIDO DE REGISTRO (Oculto por defecto con clase 'content') -->
                    <div class="content" id="register-content">
                        <form id="registerForm" class="register-form">
                            <h2>Registro de Usuario</h2>

                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="reg-username">Nombre de Usuario</label>
                                    <input type="text" id="reg-username" name="username" required
                                        placeholder="Ej: Juancito123">
                                </div>

                                <div class="form-group">
                                    <label for="reg-name">Nombre</label>
                                    <input type="text" id="reg-name" name="name" required placeholder="Ej: Juan">
                                </div>

                                <div class="form-group">
                                    <label for="reg-lastname">Apellido</label>
                                    <input type="text" id="reg-lastname" name="lastname" required
                                        placeholder="Ej: Perez">
                                </div>

                                <div class="form-group">
                                    <label for="reg-email">Correo Electrónico</label>
                                    <input type="email" id="reg-email" name="email" required
                                        placeholder="correo@ejemplo.com">
                                </div>

                                <div class="form-group">
                                    <label for="reg-password">Contraseña</label>
                                    <input type="password" id="reg-password" name="password" required
                                        placeholder="••••••••">
                                </div>

                                <div class="form-group">
                                    <label for="reg-dni">DNI</label>
                                    <input type="text" id="reg-dni" name="dni" required placeholder="324561234">
                                </div>

                                <div class="form-group">
                                    <label for="reg-telefono">Teléfono</label>
                                    <input type="tel" id="reg-telefono" name="telefono" required
                                        placeholder="2611234567">
                                </div>

                                <div class="form-group">
                                    <label for="reg-direccion">Dirección</label>
                                    <input type="text" id="reg-direccion" name="direccion" required
                                        placeholder="Ej: Av. San Martín 123">
                                </div>

                                <div class="form-group">
                                    <label for="reg-fechaNacimiento">Fecha de Nacimiento</label>
                                    <input type="date" id="reg-fechaNacimiento" name="fechaNacimiento" required>
                                </div>

                                <!-- Desplegables en cascada -->
                                <div class="form-group">
                                    <label for="idProvincia">Provincia</label>
                                    <select id="idProvincia" name="idProvincia" required>
                                        <option value="">Cargando provincias...</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="idDepartamento">Departamento</label>
                                    <select id="idDepartamento" name="idDepartamento" required disabled>
                                        <option value="">Seleccione primero una provincia</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="idLocalidad">Localidad</label>
                                    <select id="idLocalidad" name="idLocalidad" required disabled>
                                        <option value="">Seleccione primero un departamento</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Mensaje de Feedback de Registro -->
                            <div id="reg-error-message" class="login-mensaje" role="alert" aria-live="polite" hidden>
                            </div>

                            <button type="submit" class="btn-submit">Registrarse</button>
                        </form>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/header.js"></script>

</body>

</html>
